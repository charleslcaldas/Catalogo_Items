name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Type-check
        run: pnpm run typecheck

      - name: Check PocketBase JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          paths = sorted(Path('pocketbase').rglob('*.js'))
          if not paths:
              raise SystemExit('No PocketBase JavaScript files found')

          for path in paths:
              subprocess.run(['node', '--check', str(path)], check=True)

          print(f'Validated {len(paths)} PocketBase JavaScript files')
          PY

      - name: Count Python test modules
        id: python-tests
        shell: bash
        run: |
          set -euo pipefail
          count="$(python3 - <<'PY'
          from pathlib import Path

          root = Path('tests')
          print(sum(1 for path in root.rglob('test_*.py') if path.is_file()) if root.is_dir() else 0)
          PY
          )"
          printf 'count=%s\n' "${count}" >> "${GITHUB_OUTPUT}"
          printf 'Found %s Python test modules\n' "${count}"

      - name: Install verified PocketBase
        if: steps.python-tests.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/pocketbase-v0.39.0/bin"
          scripts/ci/install-pocketbase.sh "${install_dir}"
          printf 'POCKETBASE_BINARY=%s/pocketbase\n' "${install_dir}" >> "${GITHUB_ENV}"

      - name: Run Python tests
        run: python3 -B scripts/ci/run-python-tests.py

      - name: Build production bundle
        run: pnpm run build
